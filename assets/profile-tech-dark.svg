<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Профиль технологий JazList</title>
  <desc id="desc">Состав кода: PLpgSQL 38,1%, HTML 27,7%, JavaScript 11,9%, Python 11,4%, Shell 5,4%, CSS 4,8%, Другое 0,7%. Рабочий стек включает PostgreSQL, n8n, REST API, Docker, Linux, OpenAI и Anthropic.</desc>

  <rect x="1" y="1" width="878" height="358" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="32" y="42" fill="#e6edf3" font-size="24" font-weight="600">Профиль технологий</text>
    <text x="32" y="68" fill="#8b949e" font-size="14">Состав кода и рабочий стек</text>

    <g transform="rotate(-90 155 190)" fill="none" stroke-width="26">
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#21262d"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#336790" stroke-dasharray="38.1 61.9" stroke-dashoffset="-0.0"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#e34c26" stroke-dasharray="27.7 72.3" stroke-dashoffset="-38.1"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#f1e05a" stroke-dasharray="11.9 88.1" stroke-dashoffset="-65.8"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#3572a5" stroke-dasharray="11.4 88.6" stroke-dashoffset="-77.7"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#89e051" stroke-dasharray="5.4 94.6" stroke-dashoffset="-89.1"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#563d7c" stroke-dasharray="4.8 95.2" stroke-dashoffset="-94.5"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#8c959f" stroke-dasharray="0.7 99.3" stroke-dashoffset="-99.3"/>
    </g>

    <text x="155" y="184" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="600">6</text>
    <text x="155" y="207" text-anchor="middle" fill="#8b949e" font-size="13">основных языков</text>

    <g font-size="13">
      <circle cx="270" cy="116" r="6" fill="#336790"/>
      <text x="284" y="121" fill="#e6edf3">PLpgSQL</text>
      <text x="390" y="121" text-anchor="end" fill="#8b949e">38,1%</text>

      <circle cx="415" cy="116" r="6" fill="#e34c26"/>
      <text x="429" y="121" fill="#e6edf3">HTML</text>
      <text x="525" y="121" text-anchor="end" fill="#8b949e">27,7%</text>

      <circle cx="270" cy="157" r="6" fill="#f1e05a"/>
      <text x="284" y="162" fill="#e6edf3">JavaScript</text>
      <text x="390" y="162" text-anchor="end" fill="#8b949e">11,9%</text>

      <circle cx="415" cy="157" r="6" fill="#3572a5"/>
      <text x="429" y="162" fill="#e6edf3">Python</text>
      <text x="525" y="162" text-anchor="end" fill="#8b949e">11,4%</text>

      <circle cx="270" cy="198" r="6" fill="#89e051"/>
      <text x="284" y="203" fill="#e6edf3">Shell</text>
      <text x="390" y="203" text-anchor="end" fill="#8b949e">5,4%</text>

      <circle cx="415" cy="198" r="6" fill="#563d7c"/>
      <text x="429" y="203" fill="#e6edf3">CSS</text>
      <text x="525" y="203" text-anchor="end" fill="#8b949e">4,8%</text>

      <circle cx="270" cy="239" r="6" fill="#8c959f"/>
      <text x="284" y="244" fill="#e6edf3">Другое</text>
      <text x="390" y="244" text-anchor="end" fill="#8b949e">0,7%</text>
    </g>

    <line x1="550" y1="92" x2="550" y2="292" stroke="#30363d"/>

    <g>
      <text x="580" y="111" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1">ДАННЫЕ</text>
      <text x="580" y="137" fill="#e6edf3" font-size="14">PostgreSQL · SQL/PLpgSQL · Python</text>

      <text x="580" y="181" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1">ВЕБ И ИНТЕГРАЦИИ</text>
      <text x="580" y="207" fill="#e6edf3" font-size="14">JavaScript · HTML/CSS</text>
      <text x="580" y="229" fill="#e6edf3" font-size="14">n8n · REST API · Webhooks</text>

      <text x="580" y="270" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1">ИНФРАСТРУКТУРА И AI</text>
      <text x="580" y="296" fill="#e6edf3" font-size="14">Docker · Linux · Git</text>
      <text x="580" y="318" fill="#e6edf3" font-size="14">OpenAI · Anthropic</text>
    </g>
  </g>
</svg>
