<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Профиль технологий JazList</title>
  <desc id="desc">Состав кода: PL/pgSQL 38,7%, HTML 28,2%, JavaScript 12,1%, Python 10,1%, Shell 5,5%, CSS 4,9%, другое 0,7%. Рабочий стек включает PostgreSQL, n8n, REST API, Docker, Linux, OpenAI и Anthropic.</desc>

  <rect x="1" y="1" width="878" height="358" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="32" y="42" fill="#f0f6fc" font-size="24" font-weight="600">Профиль технологий</text>
    <text x="32" y="68" fill="#8b949e" font-size="14">Состав кода и рабочий стек</text>

    <g transform="rotate(-90 155 190)" fill="none" stroke-width="26">
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#21262d"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#336790" stroke-dasharray="38.66 61.34" stroke-dashoffset="0"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#e34c26" stroke-dasharray="28.17 71.83" stroke-dashoffset="-38.66"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#f1e05a" stroke-dasharray="12.09 87.91" stroke-dashoffset="-66.83"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#3572a5" stroke-dasharray="10.07 89.93" stroke-dashoffset="-78.92"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#89e051" stroke-dasharray="5.46 94.54" stroke-dashoffset="-88.99"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#563d7c" stroke-dasharray="4.86 95.14" stroke-dashoffset="-94.45"/>
      <circle cx="155" cy="190" r="72" pathLength="100" stroke="#8b949e" stroke-dasharray="0.69 99.31" stroke-dashoffset="-99.31"/>
    </g>

    <text x="155" y="184" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="600">6</text>
    <text x="155" y="207" text-anchor="middle" fill="#8b949e" font-size="13">основных языков</text>

    <g font-size="13">
      <circle cx="270" cy="116" r="6" fill="#336790"/>
      <text x="284" y="121" fill="#f0f6fc">PL/pgSQL</text>
      <text x="390" y="121" text-anchor="end" fill="#8b949e">38,7%</text>

      <circle cx="270" cy="157" r="6" fill="#f1e05a"/>
      <text x="284" y="162" fill="#f0f6fc">JavaScript</text>
      <text x="390" y="162" text-anchor="end" fill="#8b949e">12,1%</text>

      <circle cx="270" cy="198" r="6" fill="#89e051"/>
      <text x="284" y="203" fill="#f0f6fc">Shell</text>
      <text x="390" y="203" text-anchor="end" fill="#8b949e">5,5%</text>

      <circle cx="270" cy="239" r="6" fill="#8b949e"/>
      <text x="284" y="244" fill="#f0f6fc">Другое</text>
      <text x="390" y="244" text-anchor="end" fill="#8b949e">0,7%</text>

      <circle cx="415" cy="116" r="6" fill="#e34c26"/>
      <text x="429" y="121" fill="#f0f6fc">HTML</text>
      <text x="525" y="121" text-anchor="end" fill="#8b949e">28,2%</text>

      <circle cx="415" cy="157" r="6" fill="#3572a5"/>
      <text x="429" y="162" fill="#f0f6fc">Python</text>
      <text x="525" y="162" text-anchor="end" fill="#8b949e">10,1%</text>

      <circle cx="415" cy="198" r="6" fill="#563d7c"/>
      <text x="429" y="203" fill="#f0f6fc">CSS</text>
      <text x="525" y="203" text-anchor="end" fill="#8b949e">4,9%</text>
    </g>

    <line x1="550" y1="92" x2="550" y2="292" stroke="#30363d"/>

    <g>
      <text x="580" y="111" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1">ДАННЫЕ</text>
      <text x="580" y="137" fill="#f0f6fc" font-size="14">PostgreSQL · SQL/PLpgSQL · Python</text>

      <text x="580" y="181" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1">ВЕБ И ИНТЕГРАЦИИ</text>
      <text x="580" y="207" fill="#f0f6fc" font-size="14">JavaScript · HTML/CSS</text>
      <text x="580" y="229" fill="#f0f6fc" font-size="14">n8n · REST API · Webhooks</text>

      <text x="580" y="270" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1">ИНФРАСТРУКТУРА И AI</text>
      <text x="580" y="296" fill="#f0f6fc" font-size="14">Docker · Linux · Git</text>
      <text x="580" y="318" fill="#f0f6fc" font-size="14">OpenAI · Anthropic</text>
    </g>

  </g>
</svg>
